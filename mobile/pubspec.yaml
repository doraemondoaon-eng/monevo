name: monevo
description: "MONEVO — premium personal finance (Thai-first)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking & storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  image_picker: ^1.1.2

  # Security
  local_auth: ^2.3.0
  crypto: ^3.0.6
  archive: ">=3.6.1 <5.0.0"

  # UI
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1

  # intl is pinned by flutter_localizations (0.19.x on Flutter 3.27, 0.20.x on 3.29+).
  # A range keeps `pub get` working across current stable releases.
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
