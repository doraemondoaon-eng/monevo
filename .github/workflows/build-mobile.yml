name: Build Android APK (MONEVO.apk)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Publish MONEVO.apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project & preserve custom AndroidManifest.xml
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/MonevoAndroidManifest.xml
          rm -rf android
          flutter create . --org com.monevo --project-name monevo --platforms=android
          cp /tmp/MonevoAndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
          flutter pub get
          python3 - << 'EOF'
          import os, pathlib, re

          gp = pathlib.Path("android/gradle.properties")
          if gp.exists():
              txt = gp.read_text()
              txt = re.sub(r"org\.gradle\.jvmargs=.*", "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8", txt)
              if "suppressUnsupportedCompileSdk" not in txt:
                  txt += "\nandroid.suppressUnsupportedCompileSdk=34,35,36,37\n"
              gp.write_text(txt)

          kts = pathlib.Path("android/app/build.gradle.kts")
          if kts.exists():
              t = kts.read_text()
              t = t.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              t = t.replace("minSdk = flutter.minSdkVersion", "minSdk = maxOf(flutter.minSdkVersion, 23)")
              t = t.replace("ndkVersion = flutter.ndkVersion", 'ndkVersion = "27.0.12077973"')
              t = t.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false'
              )
              if "lint {" not in t:
                  t = t.replace("android {", "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }")
              kts.write_text(t)

          groovy = pathlib.Path("android/app/build.gradle")
          if groovy.exists():
              t = groovy.read_text()
              t = t.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              t = t.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              t = t.replace("minSdk = flutter.minSdkVersion", "minSdk = Math.max(flutter.minSdkVersion as int, 23)")
              t = t.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion Math.max(flutter.minSdkVersion as int, 23)")
              t = t.replace("ndkVersion = flutter.ndkVersion", 'ndkVersion = "27.0.12077973"')
              t = t.replace("ndkVersion flutter.ndkVersion", 'ndkVersion "27.0.12077973"')
              t = re.sub(
                  r"signingConfig\s*=?\s*signingConfigs\.debug",
                  "signingConfig = signingConfigs.debug\n            minifyEnabled = false\n            shrinkResources = false",
                  t
              )
              if "lintOptions" not in t:
                  t = t.replace("android {", "android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }")
              groovy.write_text(t)

          search_roots = set()
          search_roots.add(pathlib.Path(os.path.expanduser("~/.pub-cache")))
          if os.environ.get("PUB_CACHE"):
              search_roots.add(pathlib.Path(os.environ["PUB_CACHE"]))
          fp = pathlib.Path(".flutter-plugins")
          if fp.exists():
              for line in fp.read_text().splitlines():
                  if "=" in line and not line.startswith("#"):
                      search_roots.add(pathlib.Path(line.split("=", 1)[1].strip()))

          for root in search_roots:
              if root.exists():
                  for bg in root.rglob("build.gradle*"):
                      try:
                          bt = bg.read_text()
                          new_bt = re.sub(r"(compileSdk(?:Version)?\s*=?\s*)3[0-5]\b", r"\g<1>36", bt)
                          if new_bt != bt:
                              bg.write_text(new_bt)
                              print(f"Upgraded compileSdk to 36 in {bg}")
                      except Exception:
                          pass

          for kt in pathlib.Path("android/app/src/main").rglob("MainActivity.kt"):
              kt.write_text("package com.monevo.monevo\n\nimport io.flutter.embedding.android.FlutterFragmentActivity\n\nclass MainActivity : FlutterFragmentActivity()\n")
          EOF

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define=API_BASE_URL=https://monevo-api.hostless.app/api/v1
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MONEVO.apk

      - name: Upload MONEVO.apk to GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONEVO-Android-APK
          path: mobile/build/app/outputs/flutter-apk/MONEVO.apk
          retention-days: 30

      - name: Publish Direct Download Link on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MONEVO Android APK (Latest)"
          body: "ดาวน์โหลดไฟล์ **MONEVO.apk** ด้านล่างเพื่อติดตั้งลงมือถือ Android ได้ทันที (เชื่อมต่อกับ https://monevo-api.hostless.app)"
          files: mobile/build/app/outputs/flutter-apk/MONEVO.apk
