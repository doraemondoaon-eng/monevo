name: Build Android APK (MONEVO.apk)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Publish MONEVO.apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Verify permanent Android signing keystore secret
        env:
          KEYSTORE_BUNDLE: ${{ secrets.MONEVO_KEYSTORE_BUNDLE }}
        run: |
          if [ -z "$KEYSTORE_BUNDLE" ]; then
            echo "::error::Missing GitHub Secret 'MONEVO_KEYSTORE_BUNDLE'. Add it in Repo Settings -> Secrets and variables -> Actions so updates overwrite cleanly without uninstalling."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project, permanent signing & in-app updater
        env:
          KEYSTORE_BUNDLE: ${{ secrets.MONEVO_KEYSTORE_BUNDLE }}
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/MonevoAndroidManifest.xml
          cp android/app/src/main/kotlin/com/monevo/monevo/MainActivity.kt /tmp/MonevoMainActivity.kt
          cp android/app/src/main/res/xml/monevo_update_paths.xml /tmp/monevo_update_paths.xml
          rm -rf android
          flutter create . --org com.monevo --project-name monevo --platforms=android
          cp /tmp/MonevoAndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp /tmp/monevo_update_paths.xml android/app/src/main/res/xml/monevo_update_paths.xml
          find android/app/src/main -name "MainActivity.kt" -exec cp /tmp/MonevoMainActivity.kt {} \;
          rm -f test/widget_test.dart
          flutter pub get
          python3 - << 'EOF'
          import base64, json, os, pathlib, re, subprocess

          bundle = json.loads(os.environ["KEYSTORE_BUNDLE"])
          ks_password = bundle["password"]
          ks_alias = bundle.get("alias", "monevo")
          ks_bytes = base64.b64decode(bundle["keystoreBase64"])
          ks_file = pathlib.Path("android/app/monevo-release.p12")
          ks_file.write_bytes(ks_bytes)

          kt_out = subprocess.check_output(
              [
                  "keytool", "-list",
                  "-keystore", str(ks_file),
                  "-storetype", "PKCS12",
                  "-storepass", ks_password,
              ],
              text=True,
          )
          for line in kt_out.splitlines():
              if "PrivateKeyEntry" in line and "," in line:
                  ks_alias = line.split(",", 1)[0].strip()
                  break
          print(f"Verified PKCS12 release keystore alias: {ks_alias}")

          gp = pathlib.Path("android/gradle.properties")
          if gp.exists():
              txt = gp.read_text()
              txt = re.sub(r"org\.gradle\.jvmargs=.*", "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8", txt)
              if "suppressUnsupportedCompileSdk" not in txt:
                  txt += "\nandroid.suppressUnsupportedCompileSdk=34,35,36,37\n"
              gp.write_text(txt)

          kts = pathlib.Path("android/app/build.gradle.kts")
          if kts.exists():
              t = kts.read_text()
              t = t.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              t = t.replace("minSdk = flutter.minSdkVersion", "minSdk = maxOf(flutter.minSdkVersion, 23)")
              t = t.replace("ndkVersion = flutter.ndkVersion", 'ndkVersion = "27.0.12077973"')
              signing_block = (
                  "    signingConfigs {\n"
                  '        create("release") {\n'
                  '            storeFile = file("monevo-release.p12")\n'
                  f'            storePassword = "{ks_password}"\n'
                  f'            keyAlias = "{ks_alias}"\n'
                  f'            keyPassword = "{ks_password}"\n'
                  '            storeType = "PKCS12"\n'
                  "        }\n"
                  "    }\n"
                  "    buildTypes {"
              )
              t = t.replace("    buildTypes {", signing_block, 1)
              t = t.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = false\n            isShrinkResources = false'
              )
              if "lint {" not in t:
                  t = t.replace("android {", "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }")
              kts.write_text(t)

          groovy = pathlib.Path("android/app/build.gradle")
          if groovy.exists():
              t = groovy.read_text()
              t = t.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              t = t.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              t = t.replace("minSdk = flutter.minSdkVersion", "minSdk = Math.max(flutter.minSdkVersion as int, 23)")
              t = t.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion Math.max(flutter.minSdkVersion as int, 23)")
              t = t.replace("ndkVersion = flutter.ndkVersion", 'ndkVersion = "27.0.12077973"')
              t = t.replace("ndkVersion flutter.ndkVersion", 'ndkVersion "27.0.12077973"')
              signing_groovy = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  '            storeFile file("monevo-release.p12")\n'
                  f'            storePassword "{ks_password}"\n'
                  f'            keyAlias "{ks_alias}"\n'
                  f'            keyPassword "{ks_password}"\n'
                  '            storeType "PKCS12"\n'
                  "        }\n"
                  "    }\n"
                  "    buildTypes {"
              )
              t = t.replace("    buildTypes {", signing_groovy, 1)
              t = re.sub(
                  r"signingConfig\s*=?\s*signingConfigs\.debug",
                  "signingConfig = signingConfigs.release\n            minifyEnabled = false\n            shrinkResources = false",
                  t
              )
              if "lintOptions" not in t:
                  t = t.replace("android {", "android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }")
              groovy.write_text(t)

          search_roots = set()
          search_roots.add(pathlib.Path(os.path.expanduser("~/.pub-cache")))
          if os.environ.get("PUB_CACHE"):
              search_roots.add(pathlib.Path(os.environ["PUB_CACHE"]))
          fp = pathlib.Path(".flutter-plugins")
          if fp.exists():
              for line in fp.read_text().splitlines():
                  if "=" in line and not line.startswith("#"):
                      search_roots.add(pathlib.Path(line.split("=", 1)[1].strip()))

          for root in search_roots:
              if root.exists():
                  for bg in root.rglob("build.gradle*"):
                      try:
                          bt = bg.read_text()
                          new_bt = re.sub(r"(compileSdk(?:Version)?\s*=?\s*)3[0-5]\b", r"\g<1>36", bt)
                          if new_bt != bt:
                              bg.write_text(new_bt)
                              print(f"Upgraded compileSdk to 36 in {bg}")
                      except Exception:
                          pass
          EOF

      - name: Apply custom MONEVO app launcher icon (legacy + adaptive)
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet pillow || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil)
          python3 - << 'EOF'
          import pathlib
          from PIL import Image

          icon_path = pathlib.Path("assets/icon/app_icon.png")
          adaptive_path = pathlib.Path("assets/icon/app_icon_adaptive.png")
          res_dir = pathlib.Path("android/app/src/main/res")

          if icon_path.exists():
              img = Image.open(icon_path).convert("RGBA")
              for density, size in [
                  ("mipmap-mdpi", 48),
                  ("mipmap-hdpi", 72),
                  ("mipmap-xhdpi", 96),
                  ("mipmap-xxhdpi", 144),
                  ("mipmap-xxxhdpi", 192),
              ]:
                  d = res_dir / density
                  d.mkdir(parents=True, exist_ok=True)
                  img.resize((size, size), Image.Resampling.LANCZOS).save(d / "ic_launcher.png")

          if adaptive_path.exists():
              fg = Image.open(adaptive_path).convert("RGBA")
              for density, size in [
                  ("mipmap-mdpi", 108),
                  ("mipmap-hdpi", 162),
                  ("mipmap-xhdpi", 216),
                  ("mipmap-xxhdpi", 324),
                  ("mipmap-xxxhdpi", 432),
              ]:
                  d = res_dir / density
                  d.mkdir(parents=True, exist_ok=True)
                  fg.resize((size, size), Image.Resampling.LANCZOS).save(d / "ic_launcher_foreground.png")

              values_dir = res_dir / "values"
              values_dir.mkdir(parents=True, exist_ok=True)
              (values_dir / "ic_launcher_background.xml").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <color name="ic_launcher_background">#FAFAFA</color>\n'
                  '</resources>\n'
              )

              anydpi_dir = res_dir / "mipmap-anydpi-v26"
              anydpi_dir.mkdir(parents=True, exist_ok=True)
              (anydpi_dir / "ic_launcher.xml").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <background android:drawable="@color/ic_launcher_background" />\n'
                  '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\n'
                  '</adaptive-icon>\n'
              )
          print("Applied MONEVO Android launcher icons successfully.")
          EOF

      - name: Build Android Release APK & update manifest
        run: |
          BUILD_NUM="${{ github.run_number }}"
          VERSION_NAME="1.0.${BUILD_NUM}"
          export BUILD_NUM VERSION_NAME
          export RELEASE_NOTES="$(git log -1 --pretty=%s)"
          export REPO_SLUG="${{ github.repository }}"
          flutter build apk --release --no-tree-shake-icons \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUM" \
            --dart-define=API_BASE_URL=https://monevo-api-45ht.onrender.com/api/v1 \
            --dart-define=APP_VERSION="$VERSION_NAME" \
            --dart-define=APP_BUILD_NUMBER="$BUILD_NUM" \
            --dart-define=UPDATE_MANIFEST_URL="https://github.com/${REPO_SLUG}/releases/download/v1.0.0/version.json"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MONEVO.apk
          python3 - << 'EOF'
          import json, os, pathlib
          manifest = {
              "versionName": os.environ["VERSION_NAME"],
              "buildNumber": int(os.environ["BUILD_NUM"]),
              "apkUrl": f"https://github.com/{os.environ['REPO_SLUG']}/releases/download/v1.0.0/MONEVO.apk",
              "releaseNotes": os.environ.get("RELEASE_NOTES", ""),
          }
          pathlib.Path("build/app/outputs/flutter-apk/version.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2)
          )
          EOF

      - name: Upload MONEVO.apk to GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONEVO-Android-APK
          path: mobile/build/app/outputs/flutter-apk/MONEVO.apk
          retention-days: 30

      - name: Publish Direct Download Link on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MONEVO Android APK (Latest)"
          body: "ดาวน์โหลดไฟล์ **MONEVO.apk** ด้านล่างเพื่อติดตั้งลงมือถือ Android ได้ทันที (เชื่อมต่อกับ https://monevo-api-45ht.onrender.com)"
          files: |
            mobile/build/app/outputs/flutter-apk/MONEVO.apk
            mobile/build/app/outputs/flutter-apk/version.json
